services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - timezone=America/Sao_Paulo
      - -c
      - log_timezone=America/Sao_Paulo
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/inicializar-banco.sh:/docker-entrypoint-initdb.d/01-inicializar-banco.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - interno

  autenticacao:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://painel.luxbrain.com.br/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@banco:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: https://painel.luxbrain.com.br
      GOTRUE_URI_ALLOW_LIST: https://painel.luxbrain.com.br,http://painel.luxbrain.com.br
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@luxbrain.com.br
      TZ: America/Sao_Paulo
    networks:
      - interno

  api-rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      migracoes:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@banco:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      # A raiz /rest/v1/ deixa de publicar o esquema. As tabelas continuam nas rotas delas.
      PGRST_OPENAPI_MODE: disabled
      TZ: America/Sao_Paulo
    networks:
      - interno

  migracoes:
    image: postgres:16-alpine
    depends_on:
      banco:
        condition: service_healthy
      autenticacao:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ./docker/aplicar-migracoes.sh:/aplicar-migracoes.sh:ro
      - ./supabase/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/aplicar-migracoes.sh"]
    restart: "no"
    networks:
      - interno

  painel:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: https://painel.luxbrain.com.br
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    depends_on:
      migracoes:
        condition: service_completed_successfully
      autenticacao:
        condition: service_started
    environment:
      SUPABASE_URL: http://proxy
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # API administrativa do gateway: somente o servidor do painel usa.
      GATEWAY_ADMIN_URL: ${GATEWAY_ADMIN_URL}
      GATEWAY_PANEL_KEY: ${GATEWAY_PANEL_KEY}
      # Chave de plataforma (CHAVES1). Vazia: a sessão de plataforma usa a chave da empresa e o log avisa uma vez por dia.
      GATEWAY_PLATFORM_KEY: ${GATEWAY_PLATFORM_KEY:-}
      # Vazio: o convite mostra um link de uso único. Preenchido: o convite sai por e-mail (o GoTrue precisa do SMTP correspondente).
      SMTP_HOST: ${SMTP_HOST:-}
      SITE_URL: ${SITE_URL:-https://painel.luxbrain.com.br}
      PORT: "3000"
      HOST: 0.0.0.0
      TZ: America/Sao_Paulo
      # Senha de uso único do primeiro acesso. Vazia quando a conta já existe.
      BOOTSTRAP_SUPER_ADMIN_SENHA: ${BOOTSTRAP_SUPER_ADMIN_SENHA:-}
    networks:
      - interno
      - gateway

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - painel
      - autenticacao
      - api-rest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - dados_caddy:/data
      - config_caddy:/config
    networks:
      - interno
      - gateway

networks:
  interno:
  gateway:
    external: true
    name: luxbrain_gateway_proxy

volumes:
  dados_postgres:
  dados_caddy:
  config_caddy:
