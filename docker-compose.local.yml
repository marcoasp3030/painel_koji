# Ambiente de desenvolvimento na máquina local. Produção segue em docker-compose.yml.
# O código é montado no container: editar um arquivo atualiza a tela em http://localhost:8080.
name: painel-local

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - timezone=America/Sao_Paulo
      - -c
      - log_timezone=America/Sao_Paulo
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/inicializar-banco.sh:/docker-entrypoint-initdb.d/01-inicializar-banco.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  autenticacao:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8080/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@banco:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@luxbrain.com.br
      TZ: America/Sao_Paulo

  migracoes:
    image: postgres:16-alpine
    depends_on:
      banco:
        condition: service_healthy
      autenticacao:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ./docker/aplicar-migracoes.sh:/aplicar-migracoes.sh:ro
      - ./supabase/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/aplicar-migracoes.sh"]
    restart: "no"

  api-rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      migracoes:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@banco:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_OPENAPI_MODE: disabled
      TZ: America/Sao_Paulo

  painel:
    build:
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN npm install --global bun@1
        WORKDIR /app
    restart: unless-stopped
    depends_on:
      migracoes:
        condition: service_completed_successfully
      autenticacao:
        condition: service_started
      api-rest:
        condition: service_started
    working_dir: /app
    # As dependências ficam em volume próprio: as do macOS não servem no Linux do container.
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 3000"
    volumes:
      - .:/app
      - dependencias_painel:/app/node_modules
    environment:
      VITE_SUPABASE_URL: http://localhost:8080
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_URL: http://proxy
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Gateway local (repositório marcoasp3030/gateway), alcançado pela rede abaixo.
      GATEWAY_ADMIN_URL: ${GATEWAY_ADMIN_URL:-}
      GATEWAY_PANEL_KEY: ${GATEWAY_PANEL_KEY:-}
      GATEWAY_PLATFORM_KEY: ${GATEWAY_PLATFORM_KEY:-}
      SMTP_HOST: ""
      SITE_URL: http://localhost:8080
      TZ: America/Sao_Paulo
      BOOTSTRAP_SUPER_ADMIN_SENHA: ${BOOTSTRAP_SUPER_ADMIN_SENHA:-}
      MFA1_OBRIGATORIO: ${MFA1_OBRIGATORIO:-0}
    networks:
      - default
      - gateway

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - painel
      - autenticacao
      - api-rest
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/Caddyfile-local:/etc/caddy/Caddyfile:ro

networks:
  gateway:
    external: true
    name: luxbrain_gateway_proxy

volumes:
  dados_postgres:
  dependencias_painel:
